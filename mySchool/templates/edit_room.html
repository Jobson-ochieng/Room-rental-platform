<!DOCTYPE html>
<html>
<head>
    <title>Edit Room</title>
</head>
<body>
    <h1>Edit Room {{ room.room_number }}</h1>

        {% csrf_token %}

    <a href="{% url 'dashboard' %}">Cancel</a>

</html>
